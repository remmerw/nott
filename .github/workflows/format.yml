name: Ktlint Auto-Format

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  ktlint:
    runs-on: ubuntu-latest

    steps:
      # 1. Code auschecken
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      # 2. Java installieren
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Ktlint CLI sicher im Home-Verzeichnis installieren
      - name: Install Ktlint CLI
        run: |
          cd ~
          curl -sSLO https://github.com
          chmod a+x ktlint
          sudo mv ktlint /usr/local/bin/

      # 4. Code automatisch formatieren
      - name: Run Ktlint Format
        run: |
          ktlint --format
        continue-on-error: true

      # 5. Änderungen committen und hochladen
      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format Kotlin code with Ktlint"
