name: Ktlint Auto-Format

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  ktlint:
    runs-on: ubuntu-latest

    steps:
      # 1. Code aus dem Repository auschecken
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }} # Stellt sicher, dass wir auf dem richtigen Branch arbeiten

      # 2. Java installieren (wird benötigt, da Ktlint auf Java läuft)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Offizielle Ktlint-CLI herunterladen und bereitstellen
      - name: Install Ktlint CLI
        run: |
          curl -sSLO https://github.com
          chmod a+x ktlint
          sudo mv ktlint /usr/local/bin/

      # 4. Code automatisch formatieren (--format oder -F)
      - name: Run Ktlint Format
        run: |
          ktlint --format "src/**/*.kt" "src/**/*.kts"
        continue-on-error: true # Verhindert, dass die Pipeline abbricht, falls Fehler unlösbar sind

      # 5. Formatierte Dateien automatisch committen und pushen
      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format Kotlin code with Ktlint"
